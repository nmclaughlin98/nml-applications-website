<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../assets/stylesheets/main.css">
  <link rel="stylesheet" href="../assets/stylesheets/media-queries.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockbuster Theatre</title>

  <link rel="icon" type="image/png" href="../assets/Images/favicon.png" />
</head>

<body>
  <header>
    <a class="header-box" href="../index.html">
      <img class="logo" src="../assets/Images/logo.png" alt="Blockbuster Theatres">
      <span class="header-text">BLOCKBUSTER<br>THEATRE</span>
    </a>

    <nav class="nav primary-nav">
      <ul class="menu">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../nowShowing.html">Now Showing</a></li>
        <li><a href="../comingSoon.html">Coming Soon</a></li>
        <li><a href="../about.html">About</a></li>
        <li><a class="nav-cta-btn" href="../bookNow.html">Book Tickets</a></li>
      </ul>
    </nav>

    <div class="hamburger" aria-label="Toggle navigation">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
  </header>

  <div class="ham-overlay" onclick="off()"></div>

  <section class="carousel movie">
    <img id="movie-still" class="still" alt="Movie still">
    <div class="carousel-caption movie">
      <h1 id="movie-title">Loading movie…</h1>
      <img id="movie-rating" class="rating-movies" src="" alt="Age rating">
      <div id="movie-runtime" class="runtime-movies">Run Time: -- mins</div>
      <p id="movie-cast"><strong>Starring:</strong> --</p>
      <p id="movie-director">Director: --</p>
      <p id="movie-release-date">Release Date: --</p>
    </div>
  </section>

  <section class="movie-page">
    <div class="col-no-border col-2-3">
      <h2>Synopsis</h2>
      <div id="movie-synopsis">
        <p>Loading synopsis…</p>
      </div>

      <section class="ca">
        <iframe id="movie-trailer" class="trailer" referrerpolicy="strict-origin-when-cross-origin" width="560"
          height="315" src="" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </section>
    </div>

    <div class="col col-1-3">
      <h1>Show Times:</h1>
      <div id="movie-showtimes"></div>
      <a id="movie-book-link" class="form-button" href="../bookNow.html">Book Now</a>
    </div>
  </section>

  <footer>
    <small>&copy; Blockbuster Theatres</small>
    <nav class="nav secondary-nav">
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../nowShowing.html">Now Showing</a></li>
        <li><a href="../comingSoon.html">Coming Soon</a></li>
        <li><a href="../about.html">About</a></li>
      </ul>
    </nav>
  </footer>

  <div class="back-to-top" id="back-to-top" aria-label="Back to top">
    <svg viewBox="0 0 24 24">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </div>

  <script src="../assets/js/scripts.js"></script>
  <script src="../assets/js/movie-detail.js"></script>
</body>

</html>
