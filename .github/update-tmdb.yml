name: Update Movies JSON from TMDB

on:
  push:
    paths:
      - 'website/assets/data/movie-ids.json'  # Triggers when you edit your movie ID list[cite: 2]
  workflow_dispatch:                 # Allows manual run from GitHub Actions UI

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute TMDB Fetch Script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-tmdb.mjs

      - name: Commit and Push Updated movies.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add website/assets/data/movies.json
          git commit -m "chore: regenerate website/assets/data/movies.json [skip ci]" || exit 0
          git push