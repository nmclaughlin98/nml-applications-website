# Sample workflow for building and deploying a static site to GitHub Pages
name: Deploy website

on:
  # Listens for the completion of the TMDB update workflow
  workflow_run:
    workflows: ["Update Movies JSON from TMDB"] # Must match the exact `name:` inside update-tmdb.yml
    types:
      - completed

  # Automatically deploy whenever changes are merged/pushed to main
  push:
    branches:
      - main

  # Allows manual triggers directly from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages[cite: 2]
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment[cite: 2]
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # Only run if triggered manually OR if the upstream TMDB workflow succeeded[cite: 2]
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create runtime configuration
        env:
          API_REQUEST_URL: ${{ vars.API_REQUEST_URL || secrets.API_REQUEST_URL }}
        run: |
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const value = process.env.API_REQUEST_URL;
            if (!value) {
              console.error("Set the API_REQUEST_URL GitHub Actions repository variable or secret.");
              process.exit(1);
            }
            fs.writeFileSync(
              "website/assets/js/runtime-config.js",
              "window.APP_CONFIG = Object.freeze({ moviesApiUrl: " + JSON.stringify(value) + " });\n"
            );
          '
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./website

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5