name: Update Movies JSON from TMDB

on:
  push:
  workflow_dispatch:                 # Allows manual runs from the GitHub UI if needed

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Check out the exact branch that triggered the push
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute TMDB Fetch Script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-tmdb.mjs

      - name: Commit and Push Updated movies.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the updated movies.json[cite: 1]
          git add website/assets/data/movies.json
          
          # Check if movies.json actually changed before committing
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: regenerate website/assets/data/movies.json [skip ci]"
            
            # Determine target branch dynamically
            TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"
            
            # Rebase on top of the active branch remote state
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            
            # Push cleanly back to the active branch
            git push origin "HEAD:$TARGET_BRANCH"
          else
            echo "No changes detected in movies.json."
          fi
