name: Update Movies JSON from TMDB

on:
  push:
    paths:
      - 'website/assets/data/current-movie-ids.json'
      - 'website/assets/data/upcoming-movie-ids.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate current and upcoming movie data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          node scripts/fetch-current-movies-tmdb.mjs
          node scripts/fetch-upcoming-movies-tmdb.mjs

      - name: Commit and push updated movie JSON files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add website/assets/data/movies.json website/assets/data/upcoming-movies.json

          if git diff --cached --quiet; then
            echo "No changes detected in the generated movie JSON files."
            exit 0
          fi

          git commit -m "chore: regenerate TMDB movie data [skip ci]"

          TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"
          git fetch origin "$TARGET_BRANCH"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
