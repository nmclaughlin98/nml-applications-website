# Sample workflow for building and deploying a static site to GitHub Pages
name: Deploy website

on:
  # Listens for the completion of the TMDB update workflow
  workflow_run:
    workflows: ["Update Movies JSON from TMDB"] # Must match the exact `name:` inside update-tmdb.yml
    types:
      - completed

  # Allows manual triggers directly from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages[cite: 2]
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment[cite: 2]
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # Only run if triggered manually OR if the upstream TMDB workflow succeeded[cite: 2]
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5