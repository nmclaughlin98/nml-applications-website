<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Redirecting…</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages serves this file for any path that doesn't match a real
      // file (e.g. deep links or refreshes on /nowShowing.html). It encodes
      // the requested path/query into the query string and redirects to the
      // real index.html, where a small script in <head> decodes it back into
      // the URL before the React app reads window.location.
      var segmentCount = 1; // number of path segments that make up the repo name for a GitHub Pages project site
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
</head>
<body></body>
</html>
